name: CI

on:
  pull_request_target:
    branches:
      - development
      - 'v[0-9]+.[0-9]+.x'

permissions:
  contents: read

jobs:
  fail-if-unsafe:
    runs-on: ubuntu-latest
    if: ${{ !contains( github.event.pull_request.labels.*.name, 'safe-to-test') }}
    steps:
      - name: Fail if not marked as safe to test
        run: |
          echo "CI will not run on a PR unless it has the safe-to-test label applied"
          exit 1
  test:
    name: Lint & test
    runs-on: [ self-hosted, Linux ]
    if: ${{ contains( github.event.pull_request.labels.*.name, 'safe-to-test') }}
    container:
      image: golang:1.24
      credentials:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_TOKEN }}

    env:
      TSDB_TEST_TABLE_PATH: TSDB_INTEGRATION_TESTS/${{ github.sha }}

    steps:
      - name: Dump github context
        run: echo "$GITHUB_CONTEXT"
        env:
          GITHUB_CONTEXT: ${{ toJson(github) }}

      - name: Dump runner context
        run: echo "$RUNNER_CONTEXT"
        env:
          RUNNER_CONTEXT: ${{ toJson(runner) }}

      - name: Dump github ref
        run: echo "$GITHUB_REF"

      - uses: actions/checkout@v5
        with:
          ref: refs/pull/${{ github.event.number }}/merge

      - name: Lint
        run: make lint

      - name: Test short
        run: make test

      - name: Test integration
        env:
          V3IO_API: ${{ secrets.V3IO_API }}
          V3IO_ACCESS_KEY: ${{ secrets.V3IO_ACCESS_KEY }}
          V3IO_TSDB_CONFIG: ${{ github.workspace }}/test/ci_v3io.yaml
        run: make integration

      - name: Benchmark
        env:
          V3IO_API: ${{ secrets.V3IO_API }}
          V3IO_ACCESS_KEY: ${{ secrets.V3IO_ACCESS_KEY }}
          V3IO_TSDB_CONFIG: ${{ github.workspace }}/test/ci_v3io_bench.yaml
          TSDB_BENCH_INGEST_CONFIG: ${{ github.workspace }}/test/benchmark/testdata/tsdb-bench-test-config-ci.yaml
        run: make bench
